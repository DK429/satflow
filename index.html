<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SATFlow — Saturation Flow Survey</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <header>
    <h1>SATFlow — Saturation Flow Survey</h1>
    <nav>
      <button class="tab-btn" data-tab="site">Site</button>
      <button class="tab-btn" data-tab="measure">Measurements</button>
      <button class="tab-btn" data-tab="results">Results</button>
    </nav>
  </header>

  <main>
    <!-- Site Tab -->
    <section id="tab-site" class="tab active">
      <h2>Site Details</h2>
      <form id="site-form">
        <div class="grid">
          <label>Site
            <input type="text" id="site" placeholder="e.g., A638 / Doncaster Road"/>
          </label>
          <label>Junction
            <input type="text" id="junction" placeholder="e.g., A638 / B6429"/>
          </label>
          <label>Arm / Lane
            <input type="text" id="arm" placeholder="e.g., Northbound Lane 1"/>
          </label>
          <label>Surveyor
            <input type="text" id="surveyor" placeholder="e.g., J. Doe"/>
          </label>
          <label>Date
            <input type="date" id="date"/>
          </label>
          <label>Notes
            <textarea id="notes" rows="3" placeholder="Optional notes"></textarea>
          </label>
        </div>
        <div class="actions">
          <button type="button" id="start-measurements">Go to Measurements ▶</button>
        </div>
      </form>
    </section>

    <!-- Measurements Tab -->
    <section id="tab-measure" class="tab">
      <h2>Measurements</h2>

      <div class="status-row">
        <div class="status-box">
          <div class="status-label">Timer</div>
          <div id="timer-display" class="mono">00:00.00</div>
        </div>
        <div class="status-box">
          <div class="status-label">Current PCU</div>
          <div id="pcu-display" class="mono">0</div>
        </div>
        <div class="status-box">
          <div class="status-label">Total Samples</div>
          <div id="sample-count" class="mono">0</div>
        </div>
        <div class="status-box">
          <div class="status-label">Live Sat. Flow (pcu/h)</div>
          <div id="live-flow" class="mono">—</div>
        </div>
      </div>

      <div class="controls">
        <button id="green-btn" class="primary">Green</button>
        <button id="inc-pcu-btn" class="secondary" disabled>+ Vehicle</button>
        <button id="undo-btn" class="ghost" disabled>Undo</button>
        <button id="reset-current-btn" class="ghost" disabled>Reset Current</button>
        <button id="end-survey-btn" class="danger">End Survey</button>
      </div>

      <div class="table-wrap">
        <table id="samples-table">
          <thead>
            <tr>
              <th>Sample</th>
              <th>PCU</th>
              <th>Seconds</th>
            </tr>
          </thead>
          <tbody id="samples-body">
          </tbody>
        </table>
      </div>
    </section>

    <!-- Results Tab -->
    <section id="tab-results" class="tab">
      <h2>Results</h2>
      <div id="summary" class="summary"></div>
      <div class="actions">
        <button id="export-csv" class="secondary">Export CSV</button>
        <button id="export-txt" class="secondary">Export TXT</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Sample</th>
              <th>PCU</th>
              <th>Seconds</th>
              <th>Flow (pcu/h)</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <small>DK Coding · SATFlow v0.1 · Runs fully offline</small>
  </footer>

  <script src="satflow.js"></script>
</body>
</html>
