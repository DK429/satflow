<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0f172a"/>
  <title>SATFlow — Saturation Flow Survey (v1.5.1 modular)</title>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <header>
    <h1>SATFlow — Saturation Flow Survey</h1>
    <nav>
      <button class="tab-btn active" data-tab="site">Site</button>
      <button class="tab-btn" data-tab="measure">Measurements</button>
      <button class="tab-btn" data-tab="results">Results</button>
    </nav>
  </header>

  <main>
    <!-- Site Tab -->
    <section id="tab-site" class="tab active">
      <h2>Site Details</h2>
      <form id="site-form">
        <div class="grid">
          <label>Site
            <input type="text" id="site" placeholder="e.g., A638 / Doncaster Road"/>
          </label>
          <label>Junction
            <input type="text" id="junction" placeholder="e.g., A638 / B6429"/>
          </label>
          <label>Arm / Lane
            <input type="text" id="arm" placeholder="e.g., Northbound Lane 1"/>
          </label>
          <label>Surveyor
            <input type="text" id="surveyor" placeholder="e.g., J. Doe"/>
          </label>
          <label>Date
            <input type="date" id="date"/>
          </label>
          <label>Start-up Delay (s)
            <input type="number" id="delay" step="0.1" min="0" placeholder="2" />
          </label>
          <label>Notes
            <textarea id="notes" rows="3" placeholder="Optional notes"></textarea>
          </label>
          <label class="checkbox-row"><input type="checkbox" id="haptics-toggle" checked /> Enable Haptic Feedback</label>
        </div>
        <div class="actions">
          <button type="button" id="start-measurements">Go to Measurements ▶</button>
        </div>
      </form>
    </section>

    <!-- Measurements Tab -->
    <section id="tab-measure" class="tab">
      <h2>Measurements</h2>

      <div class="status-row">
        <div class="status-box">
          <div class="status-label">Timer</div>
          <div id="timer-display" class="mono big">00:00.00</div>
          <div id="delay-hint" class="hint muted">Counting starts 2s after Green</div>
        </div>
        <div class="status-box">
          <div class="status-label">Current PCU</div>
          <div id="pcu-display" class="mono big">0</div>
        </div>
        <div class="status-box">
          <div class="status-label">Live Sat. Flow (pcu/h)</div>
          <div id="live-flow" class="mono">—</div>
        </div>
      </div>

      <div id="last-sample" class="last-sample muted" style="display:none">
        Last Flow: <span id="last-flow" class="mono">—</span> (Sample <span id="last-sample-no" class="mono">—</span>)
      </div>
    </section>

    <!-- Results Tab -->
    <section id="tab-results" class="tab">
      <h2>Results</h2>
      <div id="summary" class="summary"></div>
      <div class="actions">
        <button id="export-csv" class="secondary">Export CSV</button>
        <button id="export-txt" class="secondary">Export TXT</button>
        <button id="reset-survey-btn" class="danger">Reset Survey</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Sample</th>
              <th>PCU</th>
              <th>Seconds</th>
              <th>Flow (pcu/h)</th>
              <th>Car</th>
              <th>LGV</th>
              <th>HGV</th>
              <th>Cycle</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
          <tfoot>
            <tr id="results-totals-row"></tr>
          </tfoot>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <small>DK Coding · SATFlow v1.5.1 (mobile, modular) · Runs fully offline</small>
  </footer>

  <!-- Bottom-docked Controls (visible only on Measurements tab) -->
  <div class="controls controls-docked controls-hidden" id="dock">
    <div class="veh-grid">
      <button id="btn-car" class="secondary" disabled>Car +1</button>
      <button id="btn-lgv" class="secondary" disabled>LGV +1.5</button>
      <button id="btn-hgv" class="secondary" disabled>Bus/HGV +2</button>
      <button id="btn-cycle" class="secondary" disabled>Cycle +0.5</button>
    </div>
    <button id="green-btn" class="primary wide">Green</button>
    <button id="end-of-sat-btn" class="danger wide" style="display:none">End of Sat</button>
    <div class="admin-row">
      <button id="end-survey-btn" class="danger">End Survey</button>
      <button id="delete-last-btn" class="ghost">Delete Last Sample</button>
    </div>
  </div>

  <script type="module" src="scripts/main.js"></script>
</body>
</html>
